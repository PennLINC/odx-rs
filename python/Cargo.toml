[package]
name = "odx-py"
# Inherits version, edition, license from [workspace.package] in ../Cargo.toml
# so a single bump there flows through to the wheel's filename + metadata.
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Python bindings for odx-rs (built via maturin; not published as a Rust crate)"

[lib]
name = "_odx"
crate-type = ["cdylib"]

[dependencies]
odx-rs = { path = ".." }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
ndarray = "0.16"
bytemuck = "1"
