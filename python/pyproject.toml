[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "odx"
version = "0.1.0"
description = "Python bindings for the ODX format — TRX-style mmap container for ODFs, peaks, and SH coefficients"
readme = "README.md"
requires-python = ">=3.9"
# Bulk of the package is dual MIT OR Apache-2.0; two source files in the
# underlying Rust crate (src/peak_finder.rs, src/mrtrix_sh.rs) are MPL-2.0
# because they port code from MRtrix3. Full license texts live at the repo
# root: LICENSE-MIT, LICENSE-APACHE, LICENSE-MRTRIX.
license = { text = "(MIT OR Apache-2.0) AND MPL-2.0" }
authors = [
    { name = "Matt Cieslak", email = "mattcieslak@gmail.com" },
]
keywords = [
    "diffusion-mri",
    "tractography",
    "odf",
    "spherical-harmonics",
    "fixel",
    "neuroimaging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dipy = ["dipy>=1.10"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/PennLINC/odx-rs"
Repository = "https://github.com/PennLINC/odx-rs"
Issues = "https://github.com/PennLINC/odx-rs/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
python-source = "."
module-name = "odx._odx"
