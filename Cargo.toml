[workspace]
members = [".", "python"]

# Single source of truth for the version (and other shared metadata).
# Bumping this propagates to:
#   - the parent crate's [package] below (via `version.workspace = true`)
#   - python/Cargo.toml (same)
#   - python/pyproject.toml (via `dynamic = ["version"]` — maturin reads the
#     workspace package version at build time)
# After bumping, tag the release as `vX.Y.Z` matching this version. The
# release workflow has a verify-version step that fails if the tag and
# this value disagree.
[workspace.package]
version = "0.1.1"
edition = "2021"
# Bulk of the crate is dual MIT OR Apache-2.0 (the typical Rust ecosystem
# license). Two files (src/peak_finder.rs, src/mrtrix_sh.rs) port code from
# MRtrix3 and remain MPL-2.0; see those files' headers and LICENSE-MRTRIX.
license = "(MIT OR Apache-2.0) AND MPL-2.0"
repository = "https://github.com/PennLINC/odx-rs"
homepage = "https://github.com/PennLINC/odx-rs"

[package]
name = "odx-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ODX format — TRX-style mmap container for ODFs, peaks, and SH coefficients (diffusion MRI)"
keywords = ["diffusion-mri", "odf", "fixel", "spherical-harmonics", "neuroimaging"]
categories = ["science", "data-structures"]
readme = "README.md"

[dependencies]
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
nifti = "0.17"
ndarray = "0.16"
nalgebra = "0.33"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
hdf5-metno = { version = "0.12.4", default-features = false, features = ["static", "zlib"] }
itk-transforms-rs = { version = "0.1.0", git = "https://github.com/PennLINC/itk-transforms-rs" }
statrs = "0.18"
kiddo = "5"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"
predicates = "3"

[[bench]]
name = "dsistudio_io"
harness = false

[[bench]]
name = "sphere_lookup"
harness = false
