name: Release wheels + PyPI

# Trigger on version tags (e.g. v0.1.0, v0.2.0-rc1) or manual dispatch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Linux wheels ───────────────────────────────────────────────────────────
  linux:
    name: Linux ${{ matrix.target }} (${{ matrix.libc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            libc: manylinux
          - target: aarch64
            libc: manylinux
          - target: x86_64
            libc: musllinux
          - target: aarch64
            libc: musllinux
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3-py39 wheels work for all CPython >= 3.9.
          args: --release --out dist
          working-directory: python
          manylinux: ${{ matrix.libc == 'manylinux' && 'auto' || 'musllinux_1_2' }}
          before-script-linux: |
            # The hdf5-metno static feature builds HDF5 from source; needs a C
            # compiler + cmake. manylinux/musllinux images already include these,
            # but make sure cmake is recent enough.
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y cmake
            fi
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache cmake make gcc g++ musl-dev
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: python/dist

  # ─── macOS wheels (x86_64 + Apple Silicon) ─────────────────────────────────
  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'aarch64' && 'macos-14' || 'macos-13' }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  # ─── Windows wheels ────────────────────────────────────────────────────────
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: python/dist

  # ─── Source distribution ───────────────────────────────────────────────────
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/odx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Inspect artifacts
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Switch to test.pypi.org for dry-runs by uncommenting:
          # repository-url: https://test.pypi.org/legacy/
          skip-existing: true
