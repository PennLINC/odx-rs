name: Release wheels + PyPI

# Trigger on version tags (e.g. v0.1.0, v0.2.0-rc1) or manual dispatch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Tag / version sanity check ────────────────────────────────────────────
  #
  # Refuses to build if the pushed tag (`vX.Y.Z`) doesn't match the version
  # in [workspace.package] of Cargo.toml. Catches "I tagged but forgot to
  # bump" before we waste 4× wheel build minutes on a wrong-version release.
  # All build jobs `needs: verify-version`, so a mismatch fails the whole
  # workflow at the first step.
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          # Extract the version from the [workspace.package] section.
          PKG_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml:    $PKG_VERSION"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          # Only enforce tag<->version match when triggered by a tag push.
          # workflow_dispatch and re-runs without a tag fall through.
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping tag<->version match."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag:           $TAG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match [workspace.package].version = \"$PKG_VERSION\". Bump Cargo.toml or retag."
            exit 1
          fi

  # ─── Linux wheels ───────────────────────────────────────────────────────────
  linux:
    name: Linux ${{ matrix.target }} (${{ matrix.libc }})
    runs-on: ubuntu-latest
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            libc: manylinux
          - target: aarch64
            libc: manylinux
          - target: x86_64
            libc: musllinux
          - target: aarch64
            libc: musllinux
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3-py39 wheels work for all CPython >= 3.9.
          args: --release --out dist
          working-directory: python
          manylinux: ${{ matrix.libc == 'manylinux' && 'auto' || 'musllinux_1_2' }}
          before-script-linux: |
            # The hdf5-metno static feature builds HDF5 from source; needs a C
            # compiler + cmake. manylinux/musllinux images already include these,
            # but make sure cmake is recent enough.
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y cmake
            fi
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache cmake make gcc g++ musl-dev
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: python/dist

  # ─── macOS wheels (x86_64 + Apple Silicon) ─────────────────────────────────
  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'aarch64' && 'macos-14' || 'macos-13' }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  # ─── Windows wheels ────────────────────────────────────────────────────────
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: python/dist

  # ─── Source distribution ───────────────────────────────────────────────────
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/odx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Inspect artifacts
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Switch to test.pypi.org for dry-runs by uncommenting:
          # repository-url: https://test.pypi.org/legacy/
          skip-existing: true
