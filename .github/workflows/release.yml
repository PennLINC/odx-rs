name: Release wheels + PyPI

# Trigger on version tags (e.g. v0.1.0, v0.2.0-rc1) or manual dispatch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Tag / version sanity check ────────────────────────────────────────────
  #
  # Refuses to build if the pushed tag (`vX.Y.Z`) doesn't match the version
  # in [workspace.package] of Cargo.toml. Catches "I tagged but forgot to
  # bump" before we waste 4× wheel build minutes on a wrong-version release.
  # All build jobs `needs: verify-version`, so a mismatch fails the whole
  # workflow at the first step.
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          # Extract the version from the [workspace.package] section.
          PKG_VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          echo "Cargo.toml:    $PKG_VERSION"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          # Only enforce tag<->version match when triggered by a tag push.
          # workflow_dispatch and re-runs without a tag fall through.
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping tag<->version match."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag:           $TAG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match [workspace.package].version = \"$PKG_VERSION\". Bump Cargo.toml or retag."
            exit 1
          fi

  # ─── Linux wheels ───────────────────────────────────────────────────────────
  linux:
    name: Linux ${{ matrix.target }} (${{ matrix.libc }})
    runs-on: ubuntu-latest
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            libc: manylinux
          - target: aarch64
            libc: manylinux
          - target: x86_64
            libc: musllinux
          - target: aarch64
            libc: musllinux
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        # Set the CMAKE env var so the cmake-rs crate (used by
        # hdf5-metno-src's build script) uses our pip-installed cmake
        # directly, sidestepping any PATH-resolution surprises.
        # before-script-linux populates /opt/_pipcmake/bin/cmake.
        env:
          CMAKE: /opt/_pipcmake/bin/cmake
        with:
          target: ${{ matrix.target }}
          # abi3-py39 wheels work for all CPython >= 3.9.
          args: --release --out dist
          working-directory: python
          manylinux: ${{ matrix.libc == 'manylinux' && 'auto' || 'musllinux_1_2' }}
          before-script-linux: |
            # hdf5-metno-src builds HDF5 from source via cmake; it requires
            # CMake >= 3.26. Both manylinux_2_17 (AlmaLinux yum cmake = 3.20)
            # and musllinux_1_2 (Alpine apk cmake = 3.22) ship versions that
            # are too old. Install a recent cmake from PyPI and pin its
            # path via CMAKE=... (set on the step's env above) so the
            # cmake-rs crate uses it deterministically.
            #
            # `set -ex` prints every command so failures are diagnosable
            # from the workflow log without re-running.
            set -ex

            uname -a
            cat /etc/os-release || true

            # Detect package manager and install minimal build tools for
            # the HDF5 source compile.
            if command -v apk >/dev/null 2>&1; then
              # Alpine / musllinux. apk update so package metadata is fresh.
              apk update
              apk add --no-cache make gcc g++ musl-dev linux-headers perl bash
            elif command -v dnf >/dev/null 2>&1; then
              # AlmaLinux 9 / manylinux_2_28
              dnf install -y make gcc gcc-c++ perl
            elif command -v yum >/dev/null 2>&1; then
              # AlmaLinux 8 / manylinux_2_17
              yum install -y make gcc gcc-c++ perl
            fi

            # Find a CPython 3.x in the standard PyPA layout. Prefer 3.10
            # since that's the abi3 minimum we promise; any cp3* works.
            PYBIN=""
            for d in /opt/python/cp310-cp310/bin /opt/python/cp311-cp311/bin \
                     /opt/python/cp312-cp312/bin /opt/python/cp39-cp39/bin \
                     /opt/python/cp313-cp313/bin; do
              if [ -d "$d" ]; then PYBIN="$d"; break; fi
            done
            if [ -z "$PYBIN" ]; then
              echo "::error::No /opt/python/cp3*/bin found"
              ls -la /opt/python/ 2>&1 || true
              exit 1
            fi
            echo "Selected PYBIN=$PYBIN"
            "$PYBIN/python" --version

            # Install a recent cmake from PyPI. Use --no-cache-dir so we
            # don't blow up the build cache.
            "$PYBIN/pip" install --no-cache-dir --upgrade "cmake>=3.26"

            # Pin the cmake path to match the CMAKE env var set above.
            mkdir -p /opt/_pipcmake/bin
            ln -sf "$PYBIN/cmake" /opt/_pipcmake/bin/cmake

            # Shadow common system locations as a fallback for any tool
            # that ignores CMAKE and just resolves `cmake` via PATH.
            for target in /usr/local/bin/cmake /usr/bin/cmake; do
              parent=$(dirname "$target")
              [ -d "$parent" ] && ln -sf "$PYBIN/cmake" "$target" || true
            done

            # Diagnostic: show what's where so future failures are obvious.
            command -v cmake || true
            "$PYBIN/cmake" --version
            /opt/_pipcmake/bin/cmake --version
            cmake --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: python/dist

  # ─── macOS wheels (x86_64 + Apple Silicon) ─────────────────────────────────
  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'aarch64' && 'macos-14' || 'macos-13' }}
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  # ─── Windows wheels ────────────────────────────────────────────────────────
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    needs: [verify-version]
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: python/dist

  # ─── Source distribution ───────────────────────────────────────────────────
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/odx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Inspect artifacts
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Switch to test.pypi.org for dry-runs by uncommenting:
          # repository-url: https://test.pypi.org/legacy/
          skip-existing: true
